<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>聆音桌面歌词</title>
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body>
    <div class="overlay-shell" id="shell">
      <div class="overlay-glow"></div>
      <div class="drag-strip"></div>
      <div class="overlay-status">
        <span class="status-dot"></span>
        <span id="artist">聆音</span>
      </div>
      <button class="overlay-close" id="closeButton" type="button" title="关闭桌面歌词" aria-label="关闭桌面歌词">
        <svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17" /></svg>
      </button>
      <div class="lyric-stack">
        <div class="overlay-current" id="currentLine">把每一次聆听留在原处</div>
        <div class="overlay-next" id="nextLine">聆音</div>
      </div>
      <div class="overlay-progress">
        <span id="progressBar"></span>
      </div>
    </div>
    <script src="./overlay.js"></script>
  </body>
</html>
